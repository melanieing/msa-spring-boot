spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:7002/order_db
    username: order-service
    password: order-service
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: localhost:7003
    consumer:
      group-id: inventory-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

    topic:
      inventory-reserved-result: inventory-reserved-result-topic
      inventory-reserve-request: inventory-reserve-request-topic

server:
  port: 8002

grpc:
  server:
    port: 9002