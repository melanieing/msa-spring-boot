spring:
  application:
    name: user-api-gateway

grpc:
  client:
    product-service:
      address: 'static://localhost:9001'
      negotiation-type: plaintext
    order-service:
      address: 'static://localhost:9002'
      negotiation-type: plaintext
    inventory-service:
      address: 'static://localhost:9003'
      negotiation-type: plaintext

jwt:
  # C8: 평문 하드코딩 제거. K8s 환경에서는 chart 의 secret.yaml → envFrom 으로
  # JWT_SECRET env 가 주입됨. local docker-compose 등 K8s 외 환경에서는 fallback
  # 값 사용 (운영 시 절대 fallback 사용 X).
  secret: ${JWT_SECRET:dev-only-fallback-do-not-use-in-prod}

server:
  port: 8100

management:
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    groups-order: DESC
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs