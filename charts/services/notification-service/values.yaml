# notification-service 차트 기본값 (C5).
# 다른 backend (product/order/inventory) 와 차이: DB 없음, gRPC 없음 (Kafka consumer 만).

image:
  repository: 601766312629.dkr.ecr.ap-northeast-2.amazonaws.com/notification-service
  tag: latest
  # Z fix (2026-05-13) — :latest + IfNotPresent = stale cache anti-pattern. Always 로 ECR digest 매번 확인.
  pullPolicy: Always

replicaCount: 1

service:
  type: ClusterIP

# 단일 포트 (HTTP only — actuator probe 용. Kafka consumer 는 outbound 라 listener 포트 없음).
ports:
  - name: http
    containerPort: 8004
    servicePort: 80

# 학습용 작게. notification 은 가벼운 logger 작업만.
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

healthcheck:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

env:
  SPRING_PROFILES_ACTIVE: production
  # Kafka — Strimzi 가 만든 'kafka-kafka-bootstrap' service (Issue N 의 watchAnyNamespace 후 정상 동작)
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.data.svc.cluster.local:9092
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # D2 OTel agent (Dockerfile -javaagent 활성)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
  # Y fix (2026-05-13) — agent default protocol = http/protobuf, endpoint 은 4317 (gRPC) → mismatch.
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: notification-service
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ktcloud-msa,deployment.environment=production"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none

# DB Secret 없음 (notification 은 PG 미사용)
# Redis Secret 없음 (notification 은 Redis 미사용)
# JWT Secret 없음 (notification 은 외부 호출 받지 않음 — Kafka 만)

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
