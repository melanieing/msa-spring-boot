# ─────────────────────────────────────────────────────────────────────────
# ConfigMap — 환경 변수 묶음
# ─────────────────────────────────────────────────────────────────────────
# values.yaml 의 env 섹션을 K8s ConfigMap 으로 변환.
# Deployment 가 envFrom 으로 가져와서 컨테이너 환경 변수로 주입.
#
# 비밀번호 같은 sensitive 한 값은 ConfigMap 이 아닌 Secret 사용.
# 현재는 평문 환경 변수만 (DB 비밀번호 등은 추후 K8s Secret 으로).
# ─────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "service.fullname" . }}-config
  labels:
    {{- include "service.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
