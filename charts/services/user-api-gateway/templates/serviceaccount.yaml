# ─────────────────────────────────────────────────────────────────────────
# ServiceAccount — Pod 가 K8s API 호출 시 사용할 신원
# ─────────────────────────────────────────────────────────────────────────
# Pod 가 K8s API 에 직접 호출할 일은 거의 없지만, 만약 있다면 기본
# 'default' SA 를 쓰지 않고 차트별 전용 SA 를 쓰는 게 보안 모범 사례.
# values.yaml 의 serviceAccount.create=true 일 때만 만들어짐.
# ─────────────────────────────────────────────────────────────────────────
{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "service.serviceAccountName" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
{{- end }}
