# ─────────────────────────────────────────────────────────────────────────
# JWT 서명 비밀번호 — K8s Secret 으로 분리 (C8)
# ─────────────────────────────────────────────────────────────────────────
# 이전: application.yaml 의 jwt.secret 에 평문 하드코딩 → CLAUDE.md §6 위반.
# 지금: chart values.yaml 의 jwtSecret 으로 분리 + 이 Secret 으로 K8s 에 저장
#       → deployment.yaml 의 envFrom 으로 Pod 에 JWT_SECRET env 주입
#       → application.yaml 의 ${JWT_SECRET} placeholder 가 자동 매칭.
#
# ⚠️ 학습용 평문: jwtSecret 자체는 values.yaml 에 평문이라 git 에 들어감.
#    운영급에서는 Sealed Secrets / External Secrets Operator / AWS Secrets
#    Manager 로 교체 (Phase C-1 후속 작업 예정).
#
# 운영급 패턴 wiring (envFrom secretRef) 은 이미 갖춰뒀으니 향후 도입 시
# Secret 의 source 만 바꾸면 됨.
# ─────────────────────────────────────────────────────────────────────────

{{- if .Values.jwtSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "service.fullname" . }}-jwt
  labels:
    {{- include "service.labels" . | nindent 4 }}
type: Opaque
stringData:
  # 키 이름이 곧 Pod 의 env 변수 이름이 됨 (envFrom secretRef 패턴).
  # JWT_SECRET → Spring Boot relaxed binding 으로 jwt.secret property 매칭.
  JWT_SECRET: {{ .Values.jwtSecret | quote }}
{{- end }}
