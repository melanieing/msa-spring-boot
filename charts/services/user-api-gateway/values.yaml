# ─────────────────────────────────────────────────────────────────────────
# values.yaml — 차트의 기본 설정값
# ─────────────────────────────────────────────────────────────────────────
# 'helm install --values <file>' 또는 'helm upgrade --set key=value' 로 override.
# Argo CD 는 이 파일을 자동으로 읽음 (apps-appset.yaml 의 valueFiles: [values.yaml]).
# ─────────────────────────────────────────────────────────────────────────


# ─── 컨테이너 이미지 ─────────────────────────────────────────────
image:
  # ECR repository URL. registry 모듈이 만든 그대로.
  # AWS 계정 ID 가 사람마다 다르면 helm install 시 --set 으로 override 가능.
  repository: 601766312629.dkr.ecr.ap-northeast-2.amazonaws.com/user-api-gateway

  # 'latest' 는 편의용. 운영급에서는 git SHA 로 핀 권장 (운영 재현성).
  tag: latest

  # Z fix (2026-05-13) — :latest tag 인데 IfNotPresent 면 K8s 가 캐시 이미지 그대로 사용
  # → ECR 에 새 image 있어도 Pod 가 옛 broken jar 그대로 (X fix 무력화 사례).
  # K8s 의 default for :latest 는 Always 였는데 우리가 IfNotPresent 로 override 한 게 root cause.
  # Always: 매번 ECR 에 digest 확인 (HEAD 요청 1회 비용) → 새 push 자동 반영.
  # 학습 끝난 뒤엔 :latest → git SHA tag (D1-e) 로 갈 때 IfNotPresent 복귀.
  pullPolicy: Always


# ─── replica 수 ──────────────────────────────────────────────────
# 학습용 1개. HA 시연 원하면 2~3개.
replicaCount: 1


# ─── K8s Service + 컨테이너 포트 (list 형식) ─────────────────────
# 4개 차트가 같은 templates 공유 위해 list 사용.
# user-api-gateway 는 1개, backend 들은 2개 (HTTP + gRPC).
service:
  type: ClusterIP                    # 클러스터 내부 노출만

ports:
  - name: http                        # named port — Service 가 이걸 targetPort 로 참조
    containerPort: 8100               # Pod 안의 실제 포트
    servicePort: 80                   # Service 가 노출하는 포트


# ─── 리소스 요청/제한 ────────────────────────────────────────────
# requests = 스케줄러가 보장하는 최소
# limits   = OOMKill 임계치
resources:
  requests:
    cpu: 100m                         # 0.1 vCPU
    memory: 256Mi
  limits:
    cpu: 500m                         # 0.5 vCPU
    memory: 512Mi


# ─── Health check (Spring Boot Actuator) ─────────────────────────
# Spring Boot 가 /actuator/health/{liveness,readiness} 엔드포인트 자동 노출
healthcheck:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60          # 부팅 시간 (Spring Boot 가 60초 정도 걸림)
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3


# ─── 환경 변수 (configmap.yaml 이 K8s ConfigMap 으로 주입) ──────
env:
  SPRING_PROFILES_ACTIVE: production
  # gRPC client full address (URL + 포트). application.yaml 의 ${GRPC_*_ADDRESS} placeholder 매칭.
  # 옛 GRPC_*_HOST env 는 application.yaml property (grpc.client.*-service.address) 와 매핑 안 돼서
  # gateway 가 default localhost:9001/9002/9003 으로 호출 → Connection refused → 500 cascade.
  # 사용자 검증 발견 (2026-05-12). placeholder 패턴으로 영구 fix.
  GRPC_PRODUCT_ADDRESS: "static://product-service.product-service.svc.cluster.local:9001"
  GRPC_ORDER_ADDRESS: "static://order-service.order-service.svc.cluster.local:9002"
  GRPC_INVENTORY_ADDRESS: "static://inventory-service.inventory-service.svc.cluster.local:9003"
  # Spring Boot actuator probe sub-path (/actuator/health/liveness, /readiness) 강제 활성.
  # 이거 없으면 probe 가 404 → liveness 실패 → K8s 가 kill (graceful shutdown).
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"

  # ─── C2 Rate Limit (Redis Cluster) ────────────────────────────────
  # gateway 가 RateLimitWebFilter 의 RRateLimiter (Redisson) 사용.
  # inventory-service 와 동일 Redis Cluster service 공유 (CLAUDE.md §1 의 stack 일관).
  SPRING_DATA_REDIS_CLUSTER_NODES: redis-leader.data.svc.cluster.local:6379

  # ─── D2 OTel agent — auto-instrumentation ─────────────────────────
  # Dockerfile 의 -javaagent 가 활성화. 여기 env 가 collector endpoint + service id 결정.
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
  # Y fix (2026-05-13) — OTel Java agent default protocol = http/protobuf.
  # 우리 endpoint 는 4317 (gRPC port) → "Connection reset" mismatch.
  # grpc 명시로 protocol/port 일치.
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: user-api-gateway
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ktcloud-msa,deployment.environment=production"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none           # Loki 가 stdout 직접 수집 (Promtail/Alloy 없으므로 OTel logs skip)

# C2 — reflector 가 data → user-api-gateway ns 로 복제한 redis-secret 의 'password' 키를
# SPRING_DATA_REDIS_PASSWORD env 에 valueFrom secretKeyRef 로 주입. (Issue L 패턴 재사용)
# ⚠️ redis-cluster.yaml 의 reflector annotation 에 user-api-gateway ns 추가 필요 (기존엔 inventory-service 만).
redisSecretName: redis-secret


# ─── JWT 서명 비밀번호 (C8) ──────────────────────────────────────
# templates/secret.yaml 이 이 값을 K8s Secret 으로 만들고, deployment.yaml 의
# envFrom secretRef 가 JWT_SECRET env 로 주입. application.yaml 의
# ${JWT_SECRET} placeholder 가 매칭됨.
# ⚠️ 학습용 평문. 운영급은 Sealed Secrets / External Secrets / AWS Secrets Manager.
jwtSecret: 'v7S6A9yB2E5H8KcNfUjXnZr4u7x!A%D*G-'


# ─── ServiceAccount (K8s 권한 분리) ──────────────────────────────
serviceAccount:
  create: true                        # 차트마다 전용 SA 생성 (least privilege)
  name: ""                            # 빈 문자열 → '<chart-name>-sa' 자동


# ─── Pod 보안 컨텍스트 (보안 best practice) ─────────────────────
podSecurityContext:
  runAsNonRoot: true                 # Dockerfile 에서 spring user 로 띄움
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false      # Spring Boot 가 /tmp 쓰기 필요
  capabilities:
    drop:
      - ALL
