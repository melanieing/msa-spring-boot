# ─────────────────────────────────────────────────────────────────────────
# Service — Pod 그룹에 안정적인 DNS/IP 부여
# ─────────────────────────────────────────────────────────────────────────
# Pod 는 죽으면 IP 가 바뀜. Service 가 그 위에 안정적인 추상화 제공.
# 클러스터 안에서 '<service-name>.<namespace>.svc.cluster.local' DNS 로 접근.
# values.yaml 의 ports list 를 iterate 해서 1~N 포트 지원.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}

  ports:
    {{- range .Values.ports }}
    - name: {{ .name }}
      port: {{ .servicePort }}                # Service 가 외부에 노출하는 포트
      targetPort: {{ .name }}                  # Pod 의 named port 참조 (= containerPort)
      protocol: TCP
    {{- end }}

  selector:
    {{- include "service.selectorLabels" . | nindent 4 }}
