# ─────────────────────────────────────────────────────────────────────────
# Deployment — Pod 를 띄우고 관리
# ─────────────────────────────────────────────────────────────────────────
# replicaCount 만큼 Pod 를 띄우고, Pod 죽으면 자동 재생성, rolling update 등.
# values.yaml 의 ports list 를 iterate 해서 다중 포트 지원 (gateway 1개, backend 2개).
# ─────────────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "service.fullname" . }}
  labels:
    {{- include "service.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "service.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "service.serviceAccountName" . }}

      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}

          # 다중 포트 지원 — values.yaml 의 ports list 를 그대로 iterate
          ports:
            {{- range .Values.ports }}
            - name: {{ .name }}
              containerPort: {{ .containerPort }}
              protocol: TCP
            {{- end }}

          envFrom:
            - configMapRef:
                name: {{ include "service.fullname" . }}-config

          # Secret-derived env 는 reflector (Issue L) 가 자기 ns 로 복제한 Secret 을 secretKeyRef 로 주입:
          #   - dbSecretName: CNPG 가 만든 '<cluster>-app' Secret → SPRING_DATASOURCE_PASSWORD (모든 backend)
          #   - redisSecretName: ot-redis-operator 의 redis-secret → SPRING_DATA_REDIS_PASSWORD (inventory 만)
          # gateway 처럼 둘 다 없는 서비스는 env block 자체 skip.
          {{- if or .Values.dbSecretName .Values.redisSecretName }}
          env:
            {{- if .Values.dbSecretName }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dbSecretName }}
                  key: password
            {{- end }}
            {{- if .Values.redisSecretName }}
            - name: SPRING_DATA_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redisSecretName }}
                  key: password
            {{- end }}
          {{- end }}

          # health probe 는 'http' named port 를 사용 (모든 서비스가 actuator 노출)
          livenessProbe:
            httpGet:
              path: {{ .Values.healthcheck.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.liveness.periodSeconds }}
            failureThreshold: {{ .Values.healthcheck.liveness.failureThreshold }}

          readinessProbe:
            httpGet:
              path: {{ .Values.healthcheck.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.healthcheck.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.healthcheck.readiness.periodSeconds }}
            failureThreshold: {{ .Values.healthcheck.readiness.failureThreshold }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}
