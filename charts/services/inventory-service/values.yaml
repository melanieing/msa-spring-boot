# inventory-service 차트 기본값. 가장 많은 의존성 (PG + Kafka + Redis).

image:
  repository: 601766312629.dkr.ecr.ap-northeast-2.amazonaws.com/inventory-service
  tag: latest
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  type: ClusterIP

ports:
  - name: http
    containerPort: 8003
    servicePort: 80
  - name: grpc
    containerPort: 9003
    servicePort: 9003

# 재고는 핫스팟 (PDF 6.3절). 운영급에서는 더 큰 limit 권장.
resources:
  requests:
    cpu: 200m
    memory: 384Mi
  limits:
    cpu: 1000m
    memory: 768Mi

healthcheck:
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 60
    periodSeconds: 30
    failureThreshold: 3
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3

env:
  SPRING_PROFILES_ACTIVE: production
  SPRING_DATASOURCE_URL: jdbc:postgresql://inventory-db-rw.data.svc.cluster.local:5432/inventory
  SPRING_DATASOURCE_USERNAME: inventory_app
  # Spring Boot 의 actuator probe sub-path (/actuator/health/liveness, /readiness) 강제 활성.
  # 자동 K8s 감지가 실패하는 경우 대비. 이거 없으면 probe 가 404 → liveness 실패 → K8s 가 kill.
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka-kafka-bootstrap.data.svc.cluster.local:9092

  # ─── Redis Cluster ────────────────────────────────────────────────
  # Spring Boot 3.x relaxed binding: spring.data.redis.* (Boot 2.x 의 spring.redis.* 는 deprecated/무시됨).
  # cluster.nodes 가 비어있지 않으면 Spring Data Redis (Lettuce) + Redisson 둘 다 자동으로 cluster 모드로
  # 빈 생성. seed 노드 1개만 줘도 'CLUSTER NODES' 로 master/replica 6개 topology 자동 발견.
  # service: ot-helm/redis-operator 의 RedisCluster 가 만든 'redis-leader' (3 master ClusterIP).
  SPRING_DATA_REDIS_CLUSTER_NODES: redis-leader.data.svc.cluster.local:6379
  # SPRING_DATA_REDIS_PASSWORD 는 redisSecretName 으로 deployment.yaml 이 secretKeyRef 자동 주입.

  # D2 OTel agent (Dockerfile -javaagent 활성)
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4317"
  # Y fix (2026-05-13) — agent default protocol = http/protobuf, endpoint 은 4317 (gRPC) → mismatch.
  OTEL_EXPORTER_OTLP_PROTOCOL: grpc
  OTEL_SERVICE_NAME: inventory-service
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=ktcloud-msa,deployment.environment=production"
  OTEL_TRACES_EXPORTER: otlp
  OTEL_METRICS_EXPORTER: otlp
  OTEL_LOGS_EXPORTER: none

# reflector 가 data → inventory-service ns 로 복제한 redis-secret 의 'password' 키를
# SPRING_DATA_REDIS_PASSWORD env 에 valueFrom secretKeyRef 로 주입. (Issue L)
redisSecretName: redis-secret

# CNPG 가 자동 생성한 DB Secret. 'password' 키가 deployment.yaml 의 valueFrom.secretKeyRef
# 로 SPRING_DATASOURCE_PASSWORD 에 주입됨.
dbSecretName: inventory-db-app

serviceAccount:
  create: true
  name: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop: [ALL]
